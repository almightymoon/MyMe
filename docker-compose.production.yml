# Production VPS stack. Copy to the server with env files outside Git.
# Only the reverse proxy publishes 80/443. PostgreSQL and MinIO stay private.

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MEMY_WWW_HOST: ${MEMY_WWW_HOST:-localhost}
      MEMY_API_HOST: ${MEMY_API_HOST:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/www:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public
      - private

  api:
    image: ${MEMY_API_IMAGE:-memy-api:0.0.1}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /etc/memy/api.env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - private

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    env_file:
      - /etc/memy/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - /etc/memy/minio.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - private

networks:
  public:
  private:

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
