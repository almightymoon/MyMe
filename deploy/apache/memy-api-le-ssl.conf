# MeMy API — HTTPS reverse proxy to Docker on 127.0.0.1:4020
# Does not touch forex/portfolio/lab SSL vhosts.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.memy.athariqbal.com

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:4020/
    ProxyPassReverse / http://127.0.0.1:4020/

    ErrorLog ${APACHE_LOG_DIR}/memy-api-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/memy-api-ssl-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.memy.athariqbal.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.memy.athariqbal.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
