# MeMy public website — HTTP → HTTPS
# Does not touch forex/portfolio/lab vhosts.
<VirtualHost *:80>
    ServerName memy.athariqbal.com

    DocumentRoot /opt/memy/website/apps/www

    <Directory /opt/memy/website/apps/www>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    AddType application/vnd.android.package-archive .apk
    Alias /downloads/ /opt/memy/releases/
    <Directory /opt/memy/releases>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /.well-known/acme-challenge/ /opt/memy/website/apps/www/.well-known/acme-challenge/
    <Directory /opt/memy/website/apps/www/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://memy.athariqbal.com%{REQUEST_URI} [R=301,L]

    ErrorDocument 404 /404.html
    ErrorDocument 410 /404.html
    ErrorDocument 403 /error.html
    ErrorDocument 500 /error.html
    ErrorDocument 502 /error.html
    ErrorDocument 503 /error.html

    ErrorLog ${APACHE_LOG_DIR}/memy-www-error.log
    CustomLog ${APACHE_LOG_DIR}/memy-www-access.log combined
</VirtualHost>
