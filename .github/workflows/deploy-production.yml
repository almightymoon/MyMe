name: Deploy production (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Test, build, and wait for owner approval
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: API checks
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://memy:memy_dev_password@localhost:5432/memy_test?schema=public
        run: |
          echo "This workflow is a template. Configure GitHub Secrets, a private registry, and SSH before claiming a deploy succeeded."
          npm ci
          npm test
      - name: Build API image locally in CI
        run: docker build -t memy-api:${{ github.sha }} apps/api
      - name: Stop before live SSH
        run: |
          echo "SSH deploy is not executed until the owner configures secrets."
          echo "Required: VPS_HOST, VPS_USER, VPS_SSH_KEY, REGISTRY credentials."
