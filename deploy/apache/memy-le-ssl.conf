# MeMy — HTTPS (certs by certbot). Does not touch forex/portfolio/lab SSL vhosts.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName memy.athariqbal.com

    DocumentRoot /opt/memy/website/apps/www

    <Directory /opt/memy/website/apps/www>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    AddType application/vnd.android.package-archive .apk
    Alias /downloads/ /opt/memy/releases/
    <Directory /opt/memy/releases>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api http://127.0.0.1:4020/api
    ProxyPassReverse /api http://127.0.0.1:4020/api

    ErrorDocument 404 /404.html
    ErrorDocument 410 /404.html
    ErrorDocument 403 /error.html
    ErrorDocument 500 /error.html
    ErrorDocument 502 /error.html
    ErrorDocument 503 /error.html

    ErrorLog ${APACHE_LOG_DIR}/memy-www-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/memy-www-ssl-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/memy.athariqbal.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/memy.athariqbal.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
