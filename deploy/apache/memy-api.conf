# MeMy API — HTTP → HTTPS
# Does not touch forex/portfolio/lab vhosts.
<VirtualHost *:80>
    ServerName api.memy.athariqbal.com

    DocumentRoot /opt/memy/website/apps/www

    Alias /.well-known/acme-challenge/ /opt/memy/website/apps/www/.well-known/acme-challenge/
    <Directory /opt/memy/website/apps/www/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://api.memy.athariqbal.com%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/memy-api-error.log
    CustomLog ${APACHE_LOG_DIR}/memy-api-access.log combined
</VirtualHost>
